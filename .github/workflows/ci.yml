name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review-local-only
          POSTGRES_DB: runaround_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d runaround_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNAROUND_TEST_POSTGRES_URL: postgres://review:review-local-only@127.0.0.1:5432/runaround_test
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run check
      - run: pnpm run test:unit -- --run
      - run: pnpm run build

# Nightly dependency refresh → optional patch release → GHCR image (main only).
#
# Raises the version ranges in package.json to the newest release that stays
# inside each dependency's current major (npm-check-updates `--target semver`).
# Versions published in the last few days are skipped (`--cooldown`).
#
# package.json is the only file this job edits on purpose. pnpm then re-resolves
# just the specifiers that changed, because CI and the Dockerfile install with
# --frozen-lockfile.
#
# Release policy: only bump / tag / GitHub Release / Docker when a package that
# reaches the image or Vercel build moved (scripts/nightlyRelease.mjs). A
# tooling-only update is still landed on main after checks.
#
# main requires PRs (Protect production ruleset). User-owned repos cannot add
# the built-in GitHub Actions app as a ruleset bypass, so this job opens a
# short-lived PR to main and merges it (0 required reviews) instead of pushing
# directly. Tags are pushed after the merge.
#
# Production app hosting is Vercel; GHCR is optional self-host with remote
# Postgres (compose.ghcr.yml). Dependabot still opens PRs to develop for review.

name: Nightly minor deps release

on:
  schedule:
    - cron: '17 14 * * *' # ~00:17 AEST
  workflow_dispatch:

concurrency:
  group: nightly-minor-deps-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write
  pull-requests: write

env:
  NCU_VERSION: 23.1.1
  COOLDOWN_DAYS: 3

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      release: ${{ steps.changes.outputs.release }}
      version: ${{ steps.version.outputs.version }}
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: review
          POSTGRES_PASSWORD: review-local-only
          POSTGRES_DB: runaround_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U review -d runaround_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      RUNAROUND_TEST_POSTGRES_URL: postgres://review:review-local-only@127.0.0.1:5432/runaround_test
    steps:
      - name: Checkout main
        uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      # Schedule runs from develop (default branch); main may lag and lack these
      # helpers. Restore them from the workflow commit; do not commit them here.
      - name: Load nightly release helpers
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "${{ github.sha }}"
          git checkout "${{ github.sha }}" -- \
            scripts/nightly-release-check.mjs \
            scripts/nightlyRelease.mjs

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Raise package.json ranges (same major)
        run: |
          set -euo pipefail
          npx --yes "npm-check-updates@${NCU_VERSION}" \
            --target semver \
            --cooldown "${COOLDOWN_DAYS}" \
            --upgrade

      - name: Detect package.json changes
        id: changes
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "All dependencies already at the newest in-major release."
            exit 0
          fi

          echo "changed=true" >> "$GITHUB_OUTPUT"
          git diff -- package.json
          node scripts/nightly-release-check.mjs

      - name: Sync lockfile to package.json
        if: steps.changes.outputs.changed == 'true'
        run: pnpm install --no-frozen-lockfile

      - name: Lint
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run lint

      - name: Type check
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run check

      - name: Unit tests
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run test:unit -- --run

      - name: Build
        if: steps.changes.outputs.changed == 'true'
        run: pnpm run build

      - name: Bump patch version
        if: steps.changes.outputs.release == 'true'
        id: version
        run: |
          set -euo pipefail
          NEW_VERSION="$(npm version patch --no-git-tag-version)"
          echo "version=${NEW_VERSION#v}" >> "$GITHUB_OUTPUT"
          echo "Bumped to ${NEW_VERSION}"

      - name: Commit, PR to main, merge, and tag (release only)
        if: steps.changes.outputs.changed == 'true'
        env:
          RELEASE: ${{ steps.changes.outputs.release }}
          VERSION: ${{ steps.version.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json pnpm-lock.yaml
          if [ "${RELEASE}" = "true" ]; then
            MSG="chore(deps): nightly in-major dependency update (v${VERSION})"
          else
            MSG="chore(deps): nightly in-major tooling update (no release)"
          fi
          git commit -m "$MSG"
          # A PR may have merged while tests ran.
          git fetch origin main
          git rebase origin/main
          BRANCH="nightly-deps-$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$BRANCH"
          git push -u origin HEAD
          cat > pr-body.md <<'EOF'
          Automated nightly in-major dependency update.

          Opened as a PR because main requires pull requests, and this user-owned
          repo cannot list the built-in GitHub Actions app as a ruleset bypass.
          EOF
          PR_URL="$(gh pr create --base main --head "$BRANCH" --title "$MSG" --body-file pr-body.md)"
          gh pr merge "$PR_URL" --merge --delete-branch
          if [ "${RELEASE}" = "true" ]; then
            git fetch origin main
            # Tag the merge commit on main (not the PR head).
            MERGE_SHA="$(git rev-parse origin/main)"
            git tag "v${VERSION}" "$MERGE_SHA"
            git push origin "v${VERSION}"
          fi

      - name: Create GitHub Release
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          TAG="v${VERSION}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists"
            exit 0
          fi
          {
            echo "Nightly in-major dependency update."
            echo
            echo "Vercel is primary hosting. Optional GHCR self-host uses compose.ghcr.yml with remote Postgres; web container runs migrations on start."
          } > notes.md
          gh release create "$TAG" --target main --title "$TAG" --notes-file notes.md --generate-notes

  docker:
    needs: update
    if: needs.update.outputs.release == 'true'
    uses: ./.github/workflows/docker-release.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: v${{ needs.update.outputs.version }}
